[tools]
sops = "latest"
age = "latest"
slsa-verifier = "latest"
cosign = "latest"
cargo-binstall = "latest"
lazygit = "latest"
zoxide = "latest"
bat = "latest"
fzf = "latest"
fd = "latest"
usage = "latest"
watchexec = "latest"
gh = "latest"
uv = "latest"
bun = "latest"
node = "latest"
rust = "latest"

[settings]
npm.bun = true
experimental = true
lockfile = true

[env]
_.file = { path = "{{ xdg_config_home }}/mise/secrets.json", redact = true }
SOPS_AGE_KEY_FILE = "{{ xdg_config_home }}/mise/age.txt"
